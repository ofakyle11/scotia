<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-label="Cinamate">
  <!-- CINAMATE — Lockup A (horizontal): Neural Aperture glyph + wordmark.
       Glyph height = 2.2x cap height; gap = 0.9x cap height; baseline aligned
       to the glyph's optical center. Brand Identity Spec v1.0 §1.3 -->
  <defs>
    <linearGradient id="lgRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#8B7CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="lgFlare" gradientUnits="userSpaceOnUse" x1="14" y1="50" x2="86" y2="50">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lgHolo" gradientUnits="userSpaceOnUse" x1="158" y1="122" x2="578" y2="122">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B7CF6"/>
      <stop offset="1" stop-color="#E879F9"/>
    </linearGradient>
    <filter id="lgGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- ============ THE GLYPH (96px, center 72,80) ============ -->
  <g transform="translate(24,32) scale(0.96)">
    <!-- Layer 1 — outer ring (film gate) -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#lgRing)" stroke-width="2"
            pathLength="360" stroke-dasharray="84 6" stroke-dashoffset="42"/>
    <!-- Layer 4 — anamorphic flare hairline -->
    <line x1="14" y1="50" x2="86" y2="50" stroke="url(#lgFlare)" stroke-width="0.75" opacity="0.5"/>
    <!-- Layer 2 — circuit-trace aperture blades -->
    <g fill="none" stroke-width="2.5" stroke-linecap="round">
      <polyline stroke="#22D3EE" points="50,10 63.545,32.664 57.388,40.544"/>
      <circle cx="63.545" cy="32.664" r="1.4" fill="#22D3EE" stroke="none"/>
      <circle cx="57.388" cy="40.544" r="2.2" fill="#22D3EE" stroke="none"/>
      <polyline stroke="#E879F9" points="84.641,30 71.786,53.062 61.883,51.67"/>
      <circle cx="71.786" cy="53.062" r="1.4" fill="#E879F9" stroke="none"/>
      <circle cx="61.883" cy="51.67" r="2.2" fill="#E879F9" stroke="none"/>
      <polyline stroke="#22D3EE" points="84.641,70 58.241,70.398 54.495,61.126"/>
      <circle cx="58.241" cy="70.398" r="1.4" fill="#22D3EE" stroke="none"/>
      <circle cx="54.495" cy="61.126" r="2.2" fill="#22D3EE" stroke="none"/>
      <polyline stroke="#22D3EE" points="50,90 36.455,67.336 42.612,59.456"/>
      <circle cx="36.455" cy="67.336" r="1.4" fill="#22D3EE" stroke="none"/>
      <circle cx="42.612" cy="59.456" r="2.2" fill="#22D3EE" stroke="none"/>
      <polyline stroke="#E879F9" points="15.359,70 28.214,46.938 38.117,48.33"/>
      <circle cx="28.214" cy="46.938" r="1.4" fill="#E879F9" stroke="none"/>
      <circle cx="38.117" cy="48.33" r="2.2" fill="#E879F9" stroke="none"/>
      <polyline stroke="#22D3EE" points="15.359,30 41.759,29.602 45.505,38.874"/>
      <circle cx="41.759" cy="29.602" r="1.4" fill="#22D3EE" stroke="none"/>
      <circle cx="45.505" cy="38.874" r="2.2" fill="#22D3EE" stroke="none"/>
    </g>
    <!-- Layer 3 — center core -->
    <circle cx="50" cy="50" r="5" fill="#22D3EE" opacity="0.75" filter="url(#lgGlow)"/>
    <circle cx="50" cy="50" r="9" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="50" cy="50" r="5" fill="#F4F6FB"/>
  </g>

  <!-- ============ THE WORDMARK ============ -->
  <!-- Drawn letterforms (spec §1.3): monoline geometric caps, cap height 44,
       advance 56 (0.32em-equivalent tracking). Signature details:
       both E's carry a 55% circuit-trace middle bar terminating in a node dot;
       both A's drop the crossbar for a 30%-height chevron notch. -->
  <g transform="translate(158,58)" fill="none" stroke="#F4F6FB" stroke-width="5.5"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <!-- C -->
    <path d="M36,0 H0 V44 H36"/>
    <!-- I -->
    <path d="M74,0 V44"/>
    <!-- N -->
    <path d="M112,44 V0 L148,44 V0"/>
    <!-- A (chevron notch at 30% cap height) -->
    <path d="M168,44 L186,0 L204,44"/>
    <path d="M173.4,30.8 L186,37 L198.6,30.8"/>
    <!-- M -->
    <path d="M224,44 V0 L242,26 L260,0 V44"/>
    <!-- A (chevron notch) -->
    <path d="M280,44 L298,0 L316,44"/>
    <path d="M285.4,30.8 L298,37 L310.6,30.8"/>
    <!-- T -->
    <path d="M336,0 H372 M354,0 V44"/>
    <!-- E (circuit-trace middle bar, 55% length, node terminal) -->
    <path d="M428,0 H392 V44 H428"/>
    <path d="M392,22 H411.8"/>
    <circle cx="415.6" cy="22" r="2.8" fill="#F4F6FB" stroke="none"/>
  </g>

  <!-- Signature trace-and-node: a circuit underline terminating in a lit node,
       echoing the wordmark's "circuit E" detail -->
  <g opacity="0.9">
    <line x1="158" y1="122" x2="578" y2="122" stroke="url(#lgHolo)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="586" cy="122" r="2.6" fill="#E879F9"/>
  </g>
</svg>
