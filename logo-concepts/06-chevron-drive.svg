    <use href="#lug6" x="472" y="120"/><use href="#lug6" x="496" y="120"/><use href="#lug6" x="520" y="120"/><use href="#lug6" x="544" y="120"/><use href="#lug6" x="568" y="120"/>
  </g>
  <text x="232" y="172" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="var(--lg-steel,#6E747D)">DRIVE &#8226; STEER &#8226; TRAILER</text>
