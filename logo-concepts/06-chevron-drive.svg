  <text x="228" y="102" font-size="74" font-style="italic" font-weight="900" letter-spacing="1">
    <tspan fill="var(--lg-ink,#16171A)">JF&#160;</tspan><tspan fill="var(--lg-red,#C8102E)">TIRE</tspan>
