<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460" font-family="'Arial Black',Arial,'Helvetica Neue',sans-serif">
  <defs>
    <path id="shield" d="M190 24 L346 64 V248 Q346 334 190 412 Q34 334 34 248 V64 Z"/>
    <path id="chev" d="M0 0 l26 16 26 -16 v22 l-26 16 -26 -16 z"/>
    <clipPath id="innerclip">
      <use href="#shield" transform="translate(14.25 16.35) scale(0.925)"/>
    </clipPath>
  </defs>
  <!-- outer shield -->
  <use href="#shield" fill="var(--lg-ink,#16171A)"/>
  <!-- inner face -->
  <use href="#shield" transform="translate(14.25 16.35) scale(0.925)" fill="var(--lg-paper,#FFFFFF)"/>
  <g clip-path="url(#innerclip)">
    <!-- drive-tread panel -->
    <rect x="30" y="60" width="320" height="112" fill="var(--lg-ink,#16171A)"/>
    <g fill="var(--lg-red,#C8102E)">
      <use href="#chev" x="38" y="80"/><use href="#chev" x="98" y="80"/><use href="#chev" x="158" y="80"/><use href="#chev" x="218" y="80"/><use href="#chev" x="278" y="80"/>
    </g>
    <g fill="var(--lg-steel,#6E747D)">
      <use href="#chev" x="8" y="124"/><use href="#chev" x="68" y="124"/><use href="#chev" x="128" y="124"/><use href="#chev" x="188" y="124"/><use href="#chev" x="248" y="124"/><use href="#chev" x="308" y="124"/>
    </g>
    <text x="190" y="274" text-anchor="middle" font-size="112" font-weight="900" fill="var(--lg-ink,#16171A)">JF</text>
    <!-- red band -->
    <rect x="30" y="300" width="320" height="54" fill="var(--lg-red,#C8102E)"/>
    <text x="196" y="338" text-anchor="middle" font-size="36" font-weight="900" letter-spacing="12" fill="#FFFFFF">TIRE</text>
  </g>
</svg>
