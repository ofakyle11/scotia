<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="'Arial Black',Arial,'Helvetica Neue',sans-serif">
  <defs>
    <g id="ticks" stroke="var(--lg-ink,#0B0B0C)" stroke-width="4" stroke-linecap="round">
      <line x1="52" y1="0" x2="60" y2="0"/><line x1="-52" y1="0" x2="-60" y2="0"/>
      <line x1="0" y1="52" x2="0" y2="60"/><line x1="0" y1="-52" x2="0" y2="-60"/>
      <line x1="45" y1="26" x2="52" y2="30"/><line x1="45" y1="-26" x2="52" y2="-30"/>
      <line x1="-45" y1="26" x2="-52" y2="30"/><line x1="-45" y1="-26" x2="-52" y2="-30"/>
      <line x1="26" y1="45" x2="30" y2="52"/><line x1="26" y1="-45" x2="30" y2="-52"/>
      <line x1="-26" y1="45" x2="-30" y2="52"/><line x1="-26" y1="-45" x2="-30" y2="-52"/>
    </g>
  </defs>
  <!-- rear dual -->
  <circle cx="104" cy="118" r="44" fill="none" stroke="var(--lg-ink,#0B0B0C)" stroke-width="16"/>
  <circle cx="104" cy="118" r="10" fill="var(--lg-red,#C8102E)"/>
  <use href="#ticks" transform="translate(104 118)"/>
  <!-- front dual over a paper keyline -->
  <circle cx="196" cy="118" r="62" fill="var(--lg-paper,#FFFFFF)"/>
  <circle cx="196" cy="118" r="44" fill="none" stroke="var(--lg-ink,#0B0B0C)" stroke-width="16"/>
  <circle cx="196" cy="118" r="10" fill="var(--lg-red,#C8102E)"/>
  <use href="#ticks" transform="translate(196 118)"/>
  <!-- shared road line -->
  <rect x="44" y="196" width="596" height="6" rx="3" fill="var(--lg-ink,#0B0B0C)"/>
  <text x="292" y="132" font-size="64" font-weight="900">
    <tspan fill="var(--lg-ink,#0B0B0C)">JF&#160;</tspan><tspan fill="var(--lg-red,#C8102E)">TIRE</tspan>
  </text>
  <text x="294" y="176" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="var(--lg-ink,#0B0B0C)">TRUCK &amp; TRAILER SPECIALISTS</text>
</svg>
